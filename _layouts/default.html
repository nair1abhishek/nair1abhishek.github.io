<!doctype html>
<html lang="en"><head><script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{{ page.description | default: site.description | escape }}"><title>{{ page.title | default: site.title | escape }} · {{ site.title | escape }}</title><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head>
<body><header class="site-header"><nav class="shell nav" aria-label="Main navigation"><a class="brand" href="{{ '/' | relative_url }}"><span>~/</span>abhishek<span>_</span></a><div class="nav-links"><a href="{{ '/articles/' | relative_url }}">articles</a><a href="{{ '/notes/' | relative_url }}">notes</a><a href="{{ '/archive/' | relative_url }}">archive</a><a href="{{ '/about/' | relative_url }}">about</a><a href="https://github.com/nair1abhishek">github ↗</a><button class="theme-toggle" type="button" hidden aria-label="Switch to dark mode">Dark mode</button></div></nav></header><main class="shell">{{ content }}</main><footer class="shell footer">© Abhishek <span>/</span> made for curious minds<span>_</span></footer><script>(function(){var button=document.querySelector('.theme-toggle');function sync(){var dark=document.documentElement.dataset.theme==='dark';button.textContent=dark?'Light mode':'Dark mode';button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')}button.hidden=false;sync();button.addEventListener('click',function(){var dark=document.documentElement.dataset.theme!=='dark';if(dark)document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;try{localStorage.setItem('theme',dark?'dark':'light')}catch(e){}sync()})})();</script></body></html>
